server:
  port: 8081
  tomcat:
    max-swallow-size: 100MB
    max-http-form-post-size: 100MB

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&tinyInt1isBit=false
      username: root
      # 本地运行请改成你自己的 MySQL 密码（也可通过环境变量 DB_PASSWORD 注入）
      password: ${DB_PASSWORD:root}
      initial-size: 5
      min-idle: 5
      max-active: 20
  redis:
    host: localhost
    port: 6379
    timeout: 5000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mall.entity
  configuration:
    map-underscores-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# DeepSeek AI：到 https://platform.deepseek.com/api_keys 申请自己的 Key
# 请勿把真实 Key 提交到公开仓库（也可通过环境变量 DEEPSEEK_API_KEY 注入）
deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-your-deepseek-api-key}
  api-url: https://api.deepseek.com/v1/chat/completions

# 多模型集成（OpenAI 兼容协议）
# - 没配 api-key 的模型会自动视为禁用
# - 前端切换时按 /api/ai/models 返回的列表
llm:
  deepseek:
    api-key: ${deepseek.api-key}
    api-url: ${deepseek.api-url}
    model: deepseek-chat
  qwen:
    # 阿里云 DashScope 的 OpenAI 兼容接口；申请：https://dashscope.console.aliyun.com/
    # 本地先 setx QWEN_API_KEY "sk-..." 然后重启后端
    api-key: ${QWEN_API_KEY:}
    api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    model: qwen-plus
  ollama:
    # 本地 Ollama 服务（OpenAI 兼容模式，默认 11434）
    api-url: http://localhost:11434/v1/chat/completions
    api-key: ollama
    model: qwen2:7b

jwt:
  # 生产环境务必通过环境变量 JWT_SECRET 注入随机长字符串
  secret: ${JWT_SECRET:please-change-this-secret-key-in-production}
  expiration: 6004800000

# 支付宝沙箱配置（可选，不配不影响商城核心功能）
# 502 Bad Gateway 几乎都是沙箱网关本身不稳定所致
# 1) 优先用新沙箱网关 openapi-sandbox.dl.alipaydev.com（如仍 502，临时回退到老网关 openapi.alipaydev.com）
# 2) app_id / 应用私钥 / 支付宝公钥 必须配套，且与沙箱应用一一对应（不可用别人的）
# 3) 私钥必须是不带密码的 PKCS#8 格式
# 4) 以下均为占位示例，请替换为你自己沙箱应用的值；私钥严禁提交公开仓库
alipay:
  app-id: ${ALIPAY_APP_ID:0000000000000000}
  private-key: ${ALIPAY_PRIVATE_KEY:your-sandbox-private-key-pkcs8}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:your-sandbox-alipay-public-key}
  # 沙箱网关（新版 openapi-sandbox.dl.alipaydev.com，老网关 openapi.alipaydev.com 经常 502）
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  sign-type: RSA2
  charset: UTF-8
  format: json
  notify-url: http://localhost:8081/api/payment/alipay/notify
  return-url: http://localhost:3000/order/pay-success
  sandbox: true

# MinIO 对象存储：商品图片走这里，访问走 /api/upload/minio/** 代理
# 没启 MinIO 时上传会走 fallback 落本地 uploads/ 目录
minio:
  endpoint: http://localhost:9000
  # MinIO 本地默认账号密码（生产环境请修改）
  access-key: minioadmin
  secret-key: minioadmin
  bucket: mall-product
  public-base-url: http://localhost:9000/mall-product
  # 是否强制走 MinIO（false 时若 MinIO 不可用则降级到本地）
  enabled: true
